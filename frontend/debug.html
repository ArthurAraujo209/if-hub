<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug IF-Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: monospace;
      background: #0a0a0f;
      color: #00ff00;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #111;
      border: 1px solid #00ff00;
      border-radius: 8px;
      padding: 20px;
    }
    h1 { margin-bottom: 20px; color: #00d4ff; }
    h2 { margin-top: 20px; margin-bottom: 10px; color: #43e97b; }
    .section { margin-bottom: 20px; padding: 15px; background: #0a0a0f; border-left: 3px solid #00d4ff; }
    .error { color: #f5576c; }
    .success { color: #43e97b; }
    .info { color: #00d4ff; }
    .warn { color: #fee140; }
    pre { 
      background: #000; 
      padding: 10px; 
      border-radius: 4px; 
      overflow-x: auto;
      margin-top: 10px;
    }
    button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
      margin-top: 10px;
    }
    button:hover { background: #00f2fe; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 DEBUG IF-Hub</h1>
    
    <div class="section">
      <h2>Autenticação</h2>
      <div id="auth-status"></div>
      <button onclick="checarAuth()">Verificar Autenticação</button>
      <button onclick="limparStorage()">Limpar Storage</button>
    </div>

    <div class="section">
      <h2>Firestore</h2>
      <div id="firestore-status"></div>
      <button onclick="verificarFirestore()">Verificar Firestore</button>
    </div>

    <div class="section">
      <h2>Logs</h2>
      <div id="logs" style="max-height: 400px; overflow-y: auto; background: #000; padding: 10px; border-radius: 4px;"></div>
      <button onclick="limparLogs()">Limpar Logs</button>
    </div>
  </div>

  <script type="module">
    import { auth, db, onAuthStateChanged, doc, getDoc } from './assets/js/firebase-init.js';

    const logsDiv = document.getElementById('logs');

    function addLog(tipo, msg) {
      const timestamp = new Date().toLocaleTimeString('pt-BR');
      const className = tipo === 'error' ? 'error' : tipo === 'success' ? 'success' : tipo === 'warn' ? 'warn' : 'info';
      const line = document.createElement('div');
      line.className = className;
      line.textContent = `[${timestamp}] ${msg}`;
      logsDiv.appendChild(line);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    // Interceptar console
    const origLog = console.log;
    const origError = console.error;
    const origWarn = console.warn;

    console.log = (...args) => {
      origLog(...args);
      addLog('info', args.join(' '));
    };
    console.error = (...args) => {
      origError(...args);
      addLog('error', args.join(' '));
    };
    console.warn = (...args) => {
      origWarn(...args);
      addLog('warn', args.join(' '));
    };

    window.checarAuth = async () => {
      addLog('info', '🔍 Verificando autenticação...');
      onAuthStateChanged(auth, async (user) => {
        const authDiv = document.getElementById('auth-status');
        if (!user) {
          authDiv.innerHTML = '<span class="error">❌ Não autenticado</span>';
          addLog('error', 'Usuário não autenticado');
        } else {
          authDiv.innerHTML = `
            <span class="success">✅ Autenticado</span><br>
            UID: <span class="info">${user.uid}</span><br>
            Email: <span class="info">${user.email || 'N/A'}</span>
          `;
          addLog('success', `Autenticado como: ${user.uid}`);
        }
      });
    };

    window.verificarFirestore = async () => {
      addLog('info', '🔍 Verificando Firestore...');
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          addLog('error', 'Usuário não autenticado');
          return;
        }

        try {
          const snap = await getDoc(doc(db, 'usuarios', user.uid));
          const fsDiv = document.getElementById('firestore-status');
          
          if (snap.exists()) {
            fsDiv.innerHTML = `
              <span class="success">✅ Usuário encontrado no Firestore</span><br>
              <pre>${JSON.stringify(snap.data(), null, 2)}</pre>
            `;
            addLog('success', 'Usuário encontrado no Firestore');
          } else {
            fsDiv.innerHTML = `
              <span class="error">❌ Usuário NÃO encontrado no Firestore</span><br>
              <span class="warn">UID procurado: ${user.uid}</span><br>
              <span class="info">Verifique se o backend criou o usuário corretamente</span>
            `;
            addLog('error', `Usuário não encontrado no Firestore (UID: ${user.uid})`);
          }
        } catch (err) {
          addLog('error', `Erro ao verificar Firestore: ${err.message}`);
          document.getElementById('firestore-status').innerHTML = `
            <span class="error">❌ Erro ao verificar Firestore</span><br>
            <pre>${err.message}</pre>
          `;
        }
      });
    };

    window.limparLogs = () => {
      logsDiv.innerHTML = '';
      addLog('info', 'Logs limpos');
    };

    window.limparStorage = () => {
      localStorage.clear();
      sessionStorage.clear();
      addLog('success', 'Storage limpo. Recarregue a página.');
    };

    addLog('success', 'Debug carregado. Use os botões acima para diagnosticar.');
    checarAuth();
  </script>
</body>
</html>
