<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPLIF — Entrando...</title>
  <link rel="shortcut icon" href="/assets/icons/Icone Preto sem fundo.svg" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      opacity: 0.9;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #mensagem {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      max-width: 300px;
    }

    #erro-box {
      display: none;
      background: rgba(245, 87, 108, 0.15);
      border: 1px solid rgba(245, 87, 108, 0.4);
      border-radius: 12px;
      padding: 20px 28px;
      text-align: center;
      max-width: 320px;
    }

    #erro-box h3 {
      color: #f5576c;
      margin-bottom: 8px;
    }

    #erro-box p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      margin-bottom: 16px;
    }

    #erro-box a {
      color: #00d4ff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <img class="logo" src="/assets/icons/Icone Branco sem fundo.svg" alt="IF-Hub" onerror="this.style.display='none'">

  <div class="spinner" id="spinner"></div>

  <p id="mensagem">Finalizando login...</p>

  <div id="erro-box">
    <h3>Falha no login</h3>
    <p id="erro-detalhe">Ocorreu um erro durante a autenticação.</p>
    <a href="/index.html">← Tentar novamente</a>
  </div>

  <script src="/assets/js/config.js"></script>
  <script type="module">
    import { auth, signInWithCustomToken } from './assets/js/firebase-init.js';

    // ===== DEBUG =====
    console.log('═════════════════════════════════════════');
    console.log('📍 CALLBACK.HTML CARREGADO');
    console.log('═════════════════════════════════════════');

    const params = new URLSearchParams(window.location.search);
    const firebaseToken = params.get('firebase_token');
    const suapToken     = params.get('suap_token');
    const erro          = params.get('error');

    console.log('🔗 URL Params:');
    console.log('   firebase_token:', firebaseToken ? `${firebaseToken.substring(0, 50)}...` : '❌ NÃO RECEBIDO');
    console.log('   error:', erro || '✅ Nenhum erro');

    function mostrarErro(mensagem) {
      console.error('❌ ERRO:', mensagem);
      document.getElementById('spinner').style.display   = 'none';
      document.getElementById('mensagem').style.display  = 'none';
      document.getElementById('erro-box').style.display  = 'block';
      document.getElementById('erro-detalhe').textContent = mensagem;
    }

    if (erro) {
      const mensagens = {
        auth_failed:   'Falha na autenticação com o SUAP.',
        no_code:       'Código de autorização não recebido.',
        access_denied: 'Acesso negado. Você cancelou o login.',
      };
      mostrarErro(mensagens[erro] || `Erro: ${erro}`);

    } else if (firebaseToken) {
      console.log('🔑 Token recebido, fazendo login...');
      document.getElementById('mensagem').textContent = 'Criando sessão segura...';

      try {
        // Fazer login no Firebase com o Custom Token gerado pelo backend
        console.log('🔐 Autenticando com Firebase...');
        const result = await signInWithCustomToken(auth, firebaseToken);
        
        console.log('✅ LOGIN BEM-SUCEDIDO');
        console.log('   UID:', result.user.uid);
        console.log('   Email:', result.user.email);

        // Limpar token da URL por segurança (não fica no histórico)
        window.history.replaceState({}, document.title, '/callback.html');

        document.getElementById('mensagem').textContent = 'Login realizado! Redirecionando...';

        // ✅ FIXO: Guardar token SUAP no localStorage para dashboard.js usar
        if (suapToken) {
          localStorage.setItem('suap_token', suapToken);
          console.log('✅ Token SUAP armazenado no localStorage');
        } else {
          console.warn('⚠️  Token SUAP não recebido - dashboard pode falhar');
        }

        console.log('⏳ Aguardando 3.5s antes de redirecionar para dashboard...');

        // Aguardar tempo suficiente para o Firestore replicar os dados
        setTimeout(() => {
          console.log('🚀 Redirecionando para dashboard...');
          window.location.href = '/dashboard.html';
        }, 3500);

      } catch (err) {
        console.error('❌ ERRO AO FAZER LOGIN:');
        console.error('   Mensagem:', err.message);
        console.error('   Código:', err.code);
        console.error('   Stack:', err.stack);
        mostrarErro('Erro ao criar sessão. Tente fazer login novamente.');
      }

    } else {
      console.error('❌ ERRO: Nenhum token ou erro recebido');
      mostrarErro('Nenhum dado de autenticação recebido.');
    }

    console.log('═════════════════════════════════════════\n');
  </script>
</body>
</html>
